<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075985">
<title>BMT REPORTS — Clinical Monitoring & Doctor Intimation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #075985;
    --primary-hover: #0369a1;
    --bg-main: #f1f5f9;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border-color: #cbd5e1;
    --success: #16a34a;
    --success-hover: #15803d;
    --whatsapp: #25d366;
    --whatsapp-hover: #1da851;
    --danger: #dc2626;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    line-height: 1.5;
  }

  header {
    background: linear-gradient(135deg, #075985 0%, #0c4a6e 100%);
    color: #ffffff;
    text-align: center;
    padding: 24px 16px;
    box-shadow: 0 4px 12px rgba(7, 89, 133, 0.15);
  }

  header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  header p {
    margin: 6px 0 0;
    font-size: 14px;
    opacity: 0.9;
  }

  #greeting {
    font-size: 15px;
    font-weight: 600;
    margin-top: 10px;
    color: #bae6fd;
  }

  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
  }

  .box {
    background: var(--card-bg);
    margin: 16px 0;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    border: 1px solid #e2e8f0;
  }

  h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--primary);
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 15px;
    color: var(--text-main);
    background: #f8fafc;
    transition: all 0.2s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(7, 89, 133, 0.15);
  }

  input[readonly] {
    background: #e2e8f0;
    color: #334155;
    font-weight: 600;
    cursor: not-allowed;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 20px 0;
  }

  button {
    padding: 14px 18px;
    border: 0;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }

  button:active {
    transform: scale(0.98);
  }

  .copy {
    background: var(--success);
    color: #fff;
    box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
  }
  .copy:hover { background: var(--success-hover); }

  .whatsapp {
    background: var(--whatsapp);
    color: #fff;
    box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
  }
  .whatsapp:hover { background: var(--whatsapp-hover); }

  .clear {
    background: #e2e8f0;
    color: #475569;
  }
  .clear:hover { background: #cbd5e1; }

  #report {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 10px;
    padding: 18px;
    white-space: pre-wrap;
    line-height: 1.6;
    min-height: 240px;
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    color: #0c4a6e;
    user-select: all;
  }

  .status {
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--success);
    margin-top: 10px;
    min-height: 20px;
  }

  @media(max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .buttons { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>BMT REPORTS</h1>
  <p>Clinical Monitoring & Doctor Intimation</p>
  <div id="greeting">Good Morning</div>
</header>

<main>
  <!-- Patient Details -->
  <div class="box">
    <h2>📋 Patient Details</h2>
    <div class="grid">
      <div class="form-group">
        <label for="name">Patient Name</label>
        <input id="name" placeholder="Enter patient name">
      </div>
      <div class="form-group">
        <label for="Age">Age</label>
        <input id="Age" placeholder="e.g. 45 yrs">
      </div>
      <div class="form-group">
        <label for="Weight">Weight (Kg)</label>
        <input id="Weight" placeholder="e.g. 65 Kg">
      </div>
      <div class="form-group">
        <label for="date">Date</label>
        <input id="date" type="date">
      </div>
      <div class="form-group">
        <label for="time">Time</label>
        <input id="time" type="time">
      </div>
    </div>
  </div>

  <!-- Vital Signs -->
  <div class="box">
    <h2>🩺 Vital Signs</h2>
    <div class="grid">
      <div class="form-group">
        <label for="temp">Temperature (°F)</label>
        <input id="temp" type="number" min="1" max="200" step="0.1" placeholder="98.6 °F">
      </div>
      <div class="form-group">
        <label for="pulse">Pulse Rate (beats/min)</label>
        <input id="pulse" type="number" step="0.1" placeholder="72 beats/min">
      </div>
      <div class="form-group">
        <label for="rr">Respiratory Rate (breaths/min)</label>
        <input id="rr" type="number" step="0.1" placeholder="16 breaths/min">
      </div>
      <div class="form-group">
        <label for="bp">BP (mmHg)</label>
        <input id="bp" type="text" placeholder="120/80 mmHg">
      </div>
      <div class="form-group">
        <label for="map">MAP (mmHg)</label>
        <input id="map" type="number" step="0.1" placeholder="93 mmHg">
      </div>
      <div class="form-group">
        <label for="spo2">SpO₂ (%)</label>
        <input id="spo2" type="number" min="0" max="100" step="0.1" placeholder="98 %">
      </div>
    </div>
  </div>

  <!-- Fluid Balance -->
  <div class="box">
    <h2>💧 Fluid Balance</h2>
    <div class="grid">
      <div class="form-group">
        <label for="ivf">IV Fluid Intake (mL)</label>
        <input id="ivf" type="number" step="0.1" placeholder="0 mL">
      </div>
      <div class="form-group">
        <label for="oral">Oral Intake (mL)</label>
        <input id="oral" type="number" step="0.1" placeholder="0 mL">
      </div>
      <div class="form-group">
        <label for="totalin">Total Intake (mL)</label>
        <input id="totalin" readonly placeholder="0 mL">
      </div>
      <div class="form-group">
        <label for="urine">Urine + Motion Output (mL)</label>
        <input id="urine" type="number" step="0.1" placeholder="0 mL">
      </div>
      <div class="form-group">
        <label for="motion">Motion (episodes)</label>
        <input id="motion" type="number" placeholder="0 episodes">
      </div>
      <div class="form-group">
        <label for="vomiting">Vomiting (episodes)</label>
        <input id="vomiting" type="number" placeholder="0 episodes">
      </div>
      <div class="form-group">
        <label for="totalout">Total Output (mL)</label>
        <input id="totalout" readonly placeholder="0 mL">
      </div>
      <div class="form-group">
        <label for="fluidbalance">Fluid Balance (mL)</label>
        <input id="fluidbalance" readonly placeholder="0 mL">
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="buttons">
    <button class="copy" onclick="copyFields()">
      📋 Copy Report
    </button>
    <button class="whatsapp" onclick="whatsapp()">
      💬 Send to WhatsApp
    </button>
    <button class="clear" onclick="clearAll()">
      🔄 Clear Form
    </button>
  </div>

  <!-- Formatted Preview -->
  <div class="box">
    <h2>📝 Formatted Clinical Report Preview</h2>
    <div id="report">Fill out the form above to view live preview...</div>
    <div id="status" class="status"></div>
  </div>
</main>

<script>
function E(id){ return document.getElementById(id); }
function n(id){ return parseFloat(E(id).value) || 0; }

function updateCalculations(){
  var totalIn = n("ivf") + n("oral");
  var totalOut = n("urine");
  var balance = totalIn - totalOut;
  
  E("totalin").value = totalIn ? totalIn : "";
  E("totalout").value = totalOut ? totalOut : "";
  E("fluidbalance").value = (totalIn || totalOut) ? balance : "";
  
  formatData();
}

function formatData(){
  var temp = E("temp").value;
  var pulse = E("pulse").value;
  var rr = E("rr").value;
  var bp = E("bp").value;
  var map = E("map").value;
  var spo2 = E("spo2").value;
  var ivf = E("ivf").value;
  var oral = E("oral").value;
  var totalin = E("totalin").value;
  var urine = E("urine").value;
  var motion = E("motion").value;
  var vomiting = E("vomiting").value;
  var totalout = E("totalout").value;
  var balance = E("fluidbalance").value;
  var greetingText = E("greeting") ? E("greeting").textContent : "Good Day";

  var lines = [
    greetingText + " Doctor,",
    "",
    "--- BMT CLINICAL MONITORING REPORT ---",
    "Patient Name        : " + (E("name").value || "—"),
    "Age                 : " + (E("Age").value || "—"),
    "Weight              : " + (E("Weight").value ? E("Weight").value + " Kg" : "—"),
    "Date                : " + (E("date").value || "—"),
    "Time                : " + (E("time").value || "—"),
    "",
    "--- VITAL SIGNS ---",
    "Temperature         : " + (temp ? temp + " °F" : "—"),
    "Pulse Rate          : " + (pulse ? pulse + " beats/min" : "—"),
    "Respiratory Rate    : " + (rr ? rr + " breaths/min" : "—"),
    "Blood Pressure      : " + (bp ? bp + " mmHg" : "—"),
    "MAP                 : " + (map ? map + " mmHg" : "—"),
    "SpO₂                : " + (spo2 ? spo2 + " %" : "—"),
    "",
    "--- FLUID BALANCE ---",
    "IV Fluid Intake     : " + (ivf ? ivf + " mL" : "—"),
    "Oral Intake         : " + (oral ? oral + " mL" : "—"),
    "Total Intake        : " + (totalin ? totalin + " mL" : "—"),
    "Urine + Motion Out  : " + (urine ? urine + " mL" : "—"),
    "Motion              : " + (motion ? motion + " episodes" : "—"),
    "Vomiting            : " + (vomiting ? vomiting + " episodes" : "—"),
    "Total Output        : " + (totalout ? totalout + " mL" : "—"),
    "Fluid Balance       : " + (balance ? balance + " mL" : "—")
  ];

  var text = lines.join("\n");
  E("report").textContent = text;
  return text;
}

async function copyFields(){
  var text = formatData();
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      E("status").textContent = "✓ Report copied to clipboard!";
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      E("status").textContent = ok ? "✓ Report copied to clipboard!" : "Please select text manually from the preview below.";
    }
  } catch(e) {
    E("status").textContent = "Copy failed — please select text manually from the preview.";
  }
}

function whatsapp(){
  var text = formatData();
  var encoded = encodeURIComponent(text);
  var url = "https://wa.me/?text=" + encoded;
  window.open(url, "_blank");
  E("status").textContent = "Opening WhatsApp...";
}

function clearAll(){
  if(confirm("Clear all entered clinical information?")){
    E("name").value = "";
    E("Age").value = "";
    E("Weight").value = "";
    
    var d = new Date();
    var yyyy = d.getFullYear();
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    var hh = String(d.getHours()).padStart(2, "0");
    var min = String(d.getMinutes()).padStart(2, "0");
    
    E("date").value = yyyy + "-" + mm + "-" + dd;
    E("time").value = hh + ":" + min;
    
    E("temp").value = ""; E("pulse").value = ""; E("rr").value = "";
    E("bp").value = ""; E("map").value = ""; E("spo2").value = "";
    E("ivf").value = ""; E("oral").value = ""; E("urine").value = "";
    E("motion").value = ""; E("vomiting").value = "";
    E("totalin").value = ""; E("totalout").value = ""; E("fluidbalance").value = "";
    
    E("status").textContent = "";
    
    var hour = d.getHours();
    var greeting = hour < 12 ? "Good Morning" : (hour < 17 ? "Good Afternoon" : "Good Evening");
    if(E("greeting")) E("greeting").textContent = greeting;
    
    formatData();
  }
}

/* Auto-attach input listeners */
document.querySelectorAll("input").forEach(function(input) {
  input.addEventListener("input", function() {
    updateCalculations();
  });
});

/* Initial Setup */
(function(){
  var d = new Date();
  var yyyy = d.getFullYear();
  var mm = String(d.getMonth() + 1).padStart(2, "0");
  var dd = String(d.getDate()).padStart(2, "0");
  var hh = String(d.getHours()).padStart(2, "0");
  var min = String(d.getMinutes()).padStart(2, "0");
  
  E("date").value = yyyy + "-" + mm + "-" + dd;
  E("time").value = hh + ":" + min;
  
  var hour = d.getHours();
  var greeting = hour < 12 ? "Good Morning" : (hour < 17 ? "Good Afternoon" : "Good Evening");
  if(E("greeting")) E("greeting").textContent = greeting;
  
  formatData();
})();
</script>
</body>
</html>
